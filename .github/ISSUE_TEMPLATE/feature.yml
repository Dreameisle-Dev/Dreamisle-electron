name: Feature
description: 提出一个新的功能建议或改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
assignees: ["HuanMeng-official"]

body:
  - type: markdown
    attributes:
      value: |
        💡 感谢建议。提交前请先搜索 [Issues](https://github.com/Dreameisle-Dev/Dreamisle-electron/issues) 和 PRs，确认不是重复建议；请说明使用场景，而不只是实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 你的想法
      description: 清晰简洁地描述你遇到的问题或使用场景。
      placeholder: 例如：曲库很大时，很难快速找到某个歌手的歌。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 解决方案
      description: 描述你希望如何实现；也可以只写期望的结果。
      placeholder: 例如：希望支持按歌手、专辑或文件夹筛选。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你考虑过的其他方案或临时办法。
      placeholder: 例如：目前只能手动搜索，但效果不好。

  - type: textarea
    id: context
    attributes:
      label: 附加信息
      description: 截图、设计图、参考链接或其他有助于理解需求的背景。
      render: markdown

  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过现有的 Issues 和 PRs
          required: true
        - label: 我愿意参与实现这个功能（可选）
          required: false
