name: Build macOS DMG

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG (signed & notarized / tag or manual)
        if: >-
          (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') &&
          env.CSC_LINK != ''
        run: npm run build:mac:signed -- --${{ matrix.arch }} --publish never

      - name: Build macOS DMG (ad-hoc / every push)
        if: >-
          (github.ref_type != 'tag' && github.event_name != 'workflow_dispatch') ||
          env.CSC_LINK == ''
        run: npm run build:mac -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
