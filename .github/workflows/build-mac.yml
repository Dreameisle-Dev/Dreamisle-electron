name: Build macOS DMG

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - 'v*' # 推送 v 开头的 tag 时自动构建

permissions:
  contents: read # 只需要读取权限，不再需要写权限

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG (with signing & notarization)
        if: env.CSC_LINK != ''
        run: npm run build:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build macOS DMG (unsigned)
        if: env.CSC_LINK == ''
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg # 请根据 electron-builder 实际输出目录调整
          if-no-files-found: error
          retention-days: 14 # Artifact 保留 14 天，可按需调整
