<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline' data: blob: file:;">
  <title>Dreamisle 桌面歌词</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      -webkit-app-region: drag; /* 系统原生拖动：无坐标计算，彻底避免反馈环路 */
    }

    .capsule {
      max-width: calc(100% - 32px);
      padding: 10px 28px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      font-size: 26px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .capsule.placeholder {
      opacity: 0.6;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div class="capsule placeholder" id="capsule">暂无歌词</div>
  <script>
    const capsule = document.getElementById('capsule');

    // 用 textContent 渲染，防止 LRC 文本注入 HTML
    window.lyricsApi.onText((text) => {
      const hasText = text && text.trim() !== '';
      capsule.textContent = hasText ? text : '暂无歌词';
      capsule.classList.toggle('placeholder', !hasText);
    });
  </script>
</body>

</html>
