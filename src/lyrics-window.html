<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline' data: blob: file:;">
  <title>Dreamisle 桌面歌词</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      -webkit-app-region: drag; /* 系统原生拖动：无坐标计算，彻底避免反馈环路 */
    }

    .capsule {
      max-width: calc(100% - 32px);
      padding: 10px 28px;
      border-radius: 999px;
      background: var(--capsule-bg, rgba(0, 0, 0, 0.45));
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      font-size: 26px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .capsule span {
      color: var(--capsule-color, #fff);
      opacity: var(--capsule-opacity, 1);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .capsule.placeholder {
      background: transparent; /* 占位符自身无背景：不受背景透明度设置影响 */
    }

    .capsule.placeholder span {
      opacity: calc(var(--capsule-opacity, 1) * 0.6);
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div class="capsule placeholder" id="capsule"><span id="capsuleText" data-i18n="lyrics.noLyricsShort">暂无歌词</span></div>
  <script type="module">
    import { setLang, applyLang } from './i18n.js';

    const capsule = document.getElementById('capsule');
    const capsuleText = document.getElementById('capsuleText');

    // 用 textContent 渲染，防止 LRC 文本注入 HTML
    window.lyricsApi.onText((text) => {
      const hasText = text && text.trim() !== '';
      capsuleText.textContent = hasText ? text : '';
      capsule.classList.toggle('placeholder', !hasText);
      if (!hasText) applyLang(); // 重新套用"暂无歌词"占位文案
    });

    // 语言切换：重刷占位文案（仅在占位状态下刷新，避免覆盖正在显示的歌词）
    window.lyricsApi.onLang((lang) => {
      setLang(lang);
      if (capsule.classList.contains('placeholder')) applyLang();
    });

    // 样式设置：映射到 CSS 变量
    window.lyricsApi.onStyle((style) => {
      const s = style || {};
      document.documentElement.style.setProperty('--capsule-bg', `rgba(0, 0, 0, ${(s.bgOpacity ?? 45) / 100})`);
      document.documentElement.style.setProperty('--capsule-opacity', String((s.textOpacity ?? 100) / 100));
      document.documentElement.style.setProperty('--capsule-color', s.textColor || '#ffffff');
    });
  </script>
</body>

</html>
