<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: blob: file:;"
    />
    <title>Dreamisle 桌面歌词</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        -webkit-app-region: drag; /* 系统原生拖动：无坐标计算，彻底避免反馈环路 */
      }

      .capsule {
        max-width: calc(100% - 32px);
        padding: 10px 28px;
        border-radius: 999px;
        background: var(--capsule-bg, rgba(0, 0, 0, 0.45));
        /* 毛玻璃 + 一圈极淡的发丝边：桌面背景深浅不定，纯色药丸会糊在壁纸上 */
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-sizing: border-box;
        font-family: var(
          --capsule-font-family,
          'Microsoft YaHei',
          'PingFang SC',
          'Segoe UI',
          sans-serif
        );
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.01em;
        line-height: 1.4;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        overflow: hidden;
        pointer-events: none;
      }

      .capsule span {
        display: block;
        max-width: 100%;
        color: var(--capsule-color, #fff);
        opacity: var(--capsule-opacity, 1);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 双行模式的第二行（翻译或下一句）：字号更小、透明度更低 */
      .capsule .second {
        font-size: 17px;
        font-weight: 500;
        opacity: calc(var(--capsule-opacity, 1) * 0.55);
      }

      .capsule .second[hidden] {
        display: none;
      }

      .capsule.placeholder {
        background: transparent; /* 占位符自身无背景：不受背景透明度设置影响 */
        border-color: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      /* 性能模式：桌面歌词窗是独立渲染进程，由主进程随样式一起下发 */
      body.performance-mode .capsule {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .capsule.placeholder #capsuleText {
        opacity: calc(var(--capsule-opacity, 1) * 0.6);
        font-size: 20px;
      }
    </style>
  </head>

  <body>
    <div class="capsule placeholder" id="capsule">
      <span id="capsuleText" data-i18n="lyrics.noLyricsShort">暂无歌词</span>
      <span class="second" id="capsuleSecond" hidden></span>
    </div>
    <script type="module">
      import { setLang, applyLang } from '../shared/i18n.js';

      const capsule = document.getElementById('capsule');
      const capsuleText = document.getElementById('capsuleText');
      const capsuleSecond = document.getElementById('capsuleSecond');

      let currentText = '';
      let secondText = '';
      let lines = 1; // 1 = 单行，2 = 双行

      function render() {
        const hasText = currentText && currentText.trim() !== '';
        capsuleText.textContent = hasText ? currentText : '';
        capsule.classList.toggle('placeholder', !hasText);

        const showSecond = hasText && lines === 2 && secondText && secondText.trim() !== '';
        capsuleSecond.textContent = showSecond ? secondText : '';
        capsuleSecond.hidden = !showSecond;

        if (!hasText) applyLang(); // 重新套用"暂无歌词"占位文案
      }

      // 用 textContent 渲染，防止 LRC 文本注入 HTML；payload = { text, secondText }
      window.lyricsApi.onText((payload) => {
        if (typeof payload === 'string') {
          currentText = payload;
          secondText = '';
        } else {
          currentText = payload?.text || '';
          secondText = payload?.secondText || '';
        }
        render();
      });

      // 语言切换：重刷占位文案（仅在占位状态下刷新，避免覆盖正在显示的歌词）
      window.lyricsApi.onLang((lang) => {
        setLang(lang);
        if (capsule.classList.contains('placeholder')) applyLang();
      });

      // 样式设置：映射到 CSS 变量；lines 控制单/双行
      window.lyricsApi.onStyle((style) => {
        const s = style || {};
        lines = s.lines === 2 ? 2 : 1;
        document.body.classList.toggle('performance-mode', s.performance === true);
        document.documentElement.style.setProperty(
          '--capsule-bg',
          `rgba(0, 0, 0, ${(s.bgOpacity ?? 45) / 100})`
        );
        document.documentElement.style.setProperty(
          '--capsule-opacity',
          String((s.textOpacity ?? 100) / 100)
        );
        document.documentElement.style.setProperty('--capsule-color', s.textColor || '#ffffff');
        // 自定义字体：为空时移除变量，回退到 .capsule 的默认字体栈
        if (s.fontFamily) {
          document.documentElement.style.setProperty('--capsule-font-family', `"${s.fontFamily}"`);
        } else {
          document.documentElement.style.removeProperty('--capsule-font-family');
        }
        render();
      });
    </script>
  </body>
</html>
